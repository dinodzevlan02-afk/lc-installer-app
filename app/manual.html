<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Job sheet - LC Installer App</title>
<meta name="theme-color" content="#0a0e1a">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lci.css">
<!-- Install guide for one product on one job: manual.html?job=<id>&p=<productKey>.
     Generated in the page (lci-manual.js) from the design (mount height,
     arrangement, tilt, options, tags) and the LC catalog (photo, mounts,
     voltages, manufacturer PDFs). No DRAFT note (Dino, 2026-10-21). -->
<style>
  .shell { max-width: 900px; margin: 0 auto; padding: 18px 16px 60px; }
  .hdr { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .hdr img.prod { width: 120px; height: 120px; object-fit: contain; background: #fff; border-radius: 10px; }
  h1 { font-family: var(--display); font-size: 24px; letter-spacing: .06em; margin: 0; }
  h2 { font-family: var(--display); font-size: 15px; letter-spacing: .12em; text-transform: uppercase; margin: 28px 0 10px; color: var(--orange); }
  .warn { margin: 12px 0; padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(248,113,113,.5); background: rgba(248,113,113,.08); font-size: 14px; }
  ol, ul { padding-left: 22px; } li { margin: 7px 0; font-size: 16px; line-height: 1.5; }
  .guide-pdf { display: flex; flex-direction: column; gap: 4px; margin: 18px 0 0; padding: 14px 16px; border-radius: 10px; border: 1px solid var(--orange); background: rgba(243,112,33,.12); color: var(--text-1); text-decoration: none; }
  a.guide-pdf:hover { background: rgba(243,112,33,.22); }
  .guide-pdf .k { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--orange); }
  .guide-pdf b { font-size: 17px; }
  .guide-pdf.off { border-color: var(--border); background: transparent; }
  .guide-pdf.off .k { color: var(--text-3); }
  @media print { .guide-pdf { display: none; } }
  .docs { display: flex; flex-wrap: wrap; gap: 8px; }
  .docs .btn { min-height: 44px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--border); }
  th { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-3); }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 15px; }
  .kv dt { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-3); padding-top: 4px; }
  .kv dd { margin: 0; }
  @media print { .noprint, #lciBeta { display: none; } body { background: #fff; color: #000; } }
</style>
</head>
<body>
<div class="shell">
  <p class="noprint"><a class="btn small" id="back" href="./home.html">&larr; Back to the job</a> <button type="button" class="small" onclick="print()">Print</button></p>
  <div id="out"><p class="muted">Loading…</p></div>
</div>
<script src="lci.js"></script>
<script src="lci-manual.js"></script>
</body>
</html>
