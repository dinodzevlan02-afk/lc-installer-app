name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  # Deploy main by hand (Actions > Run workflow). Added 2026-10-21 after
  # GitHub dropped the push events for two merges and nothing deployed.
  workflow_dispatch:

# One production deploy at a time: two at once collide in Azure and one
# fails (2026-10-21, runs 89 and 90). Queued, not cancelled, so a late stale
# run can never cancel the fresh one; it waits and then skips itself.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'production' }}
  cancel-in-progress: false

jobs:
  smoke_test_job:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: API smoke test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests and API checks (npm test)
        run: npm test

  build_and_deploy_job:
    needs: smoke_test_job
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      # GitHub has delivered push events up to 30 minutes late (2026-10-21:
      # #25's run deployed at 15:03, over #26 and #27). A run for main that
      # is no longer main's head would put old code live, so it skips.
      - name: Skip if this is not the newest main
        id: fresh
        if: github.event_name != 'pull_request'
        run: |
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ -n "$head" ] && [ "$head" != "$GITHUB_SHA" ]; then
            echo "main is at $head, this run is for $GITHUB_SHA: not deploying old code."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build And Deploy
        id: builddeploy
        if: steps.fresh.outputs.stale != 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WITTY_PLANT_08257F31E }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "app" # Only app/ is published: dev/, docs/, tools/, tests/ never reach the site
          api_location: "api" # Azure Functions: sign-in, logins, jobs
          output_location: "" # Built app content directory - optional
          skip_app_build: true # Plain HTML, nothing to build
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WITTY_PLANT_08257F31E }}
          action: "close"
